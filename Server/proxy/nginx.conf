# Ferry — TLS-терминатор перед релеем.
#
# Одна точка входа на 443:
#   https://<host>/            страница, установщик клиента, /api
#   wss://<host>/wsf           управление и чанки
#
# Заметьте: обе роли идут в ОДИН порт приложения. Сервер Ferry сам
# опознаёт запрос на смену протокола и передаёт сокет вебсокету (см.
# HttpFileServer::looksLikeWebSocketUpgrade), поэтому здесь не нужно ни
# второго upstream, ни отдельного location с другим портом — в отличие от
# MeetUp, где ws живёт на 9000.

# Заголовок Connection для апгрейда. Без map пришлось бы жёстко писать
# "upgrade" на всех запросах, и обычный HTTP-ответ ломался бы у части
# прокси по дороге.
map $http_upgrade $ferry_connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP: отдаёт ACME-challenge для Let's Encrypt, остальное — редирект.
server {
    listen 80;

    # HTTP-01 challenge должен отдаваться по http без редиректа, иначе
    # certbot не подтвердит домен. Файлы кладёт certbot в этот webroot
    # (см. 20-certbot.sh / 30-renew-loop.sh).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    # Стабильные пути. Реальные файлы под live/ подкладывает entrypoint ДО
    # старта nginx: без домена — самоподписанный, с доменом — Let's Encrypt.
    ssl_certificate     /etc/nginx/certs/live/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/privkey.pem;

    # По HTTP в Ferry не загружают ничего: том едет по вебсокету, а
    # POST /api/transfers — это пустое тело. Мелкий потолок здесь не
    # ограничение, а защита.
    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Бинарь клиента. Сжимать его бессмысленно (он уже плотный), а
    # проксировать через буфер вредно: nginx сначала складывал бы
    # несколько мегабайт во временный файл и только потом начинал отдавать.
    location /dl/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_buffering off;
        gzip off;
    }

    # Вебсокет: тот же upstream, но с апгрейдом и длинными таймаутами.
    #
    # Сутки, а не час: раздача живёт ровно столько, сколько запущен
    # `ferry send`, и рвать её по таймауту прокси нельзя. Между чанками
    # пауз не бывает, но между «ссылка создана» и «пришёл первый
    # получатель» может пройти сколько угодно времени.
    location /wsf {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ferry_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_buffering off;
    }

    # Всё остальное: страницы, /install.sh, /api.
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
