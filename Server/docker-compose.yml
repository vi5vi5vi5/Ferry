# Ferry: релей + nginx-терминатор TLS.
#
# Запуск и обновление:  ./tools/update.sh --force
#
# Наружу опубликован только proxy: 443 — https и wss, 80 — редирект на
# https и ACME-challenge. Порт приложения (8080) наружу не торчит.
# Переопределить порты хоста:
#   HTTPS_PORT=8443 HTTP_PORT=8081 docker compose up -d --build
#
# TLS: без DOMAIN — самоподписанный сертификат (браузер и curl будут
# ругаться, клиенту понадобится --insecure). С доменом — Let's Encrypt по
# HTTP-01 с автопродлением:
#   DOMAIN=ferry.example.ru LETSENCRYPT_EMAIL=you@mail.com docker compose up -d --build
# В режиме с доменом HTTP_PORT переопределять нельзя: challenge всегда
# идёт на внешний порт 80.

# Имя проекта задано ЯВНО, и это не косметика.
#
# По умолчанию compose берёт имя от каталога, в котором лежит этот файл.
# Каталог называется Server — ровно как у MeetUp. На сервере, где стоят
# оба, `docker compose up` в Ferry счёл бы контейнеры MeetUp своими и
# заменил бы их: одинаковое имя проекта, одинаковые имена сервисов
# (app, proxy). MeetUp бы просто выключился, а понять почему — отдельный
# вечер.
#
# Имя MeetUp при этом НЕ трогаем: там оно уже привязано к томам с
# сертификатами Let's Encrypt (server_certs, server_letsencrypt), и
# переименование проекта осиротило бы их вместе с сертификатом.
name: ferry

services:
  app:
    build:
      # Контекст — корень репозитория: образ собирает сервер, общее ядро и
      # CLI-клиент, который потом раздаётся через /install.sh.
      context: ..
      dockerfile: Server/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_MODIFIED: ${GIT_MODIFIED:-0}
        # Собирать ли клиент под Windows. Заглушка вместо настоящей стадии
        # экономит несколько минут первой сборки; см. --skip-windows.
        WINDOWS_STAGE: ${WINDOWS_STAGE:-build-client-windows}
    restart: unless-stopped
    volumes:
      # ЕДИНСТВЕННОЕ, что Ferry читает с диска, — ferry.conf. Данных
      # раздач здесь нет и не будет: они живут в оперативке и умирают
      # вместе с процессом. Это обещание продукта, а не недоработка.
      - ./mount:/app/mount:ro

  proxy:
    # Свой TLS-терминатор нужен, только когда Ferry живёт на сервере один.
    # Если 80 и 443 держит сосед (MeetUp), прокси не поднимается, а Ferry
    # встаёт за чужой — см. --behind-proxy в tools/update.sh.
    profiles: ["standalone"]
    build: proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - DOMAIN=${DOMAIN:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
    volumes:
      - certs:/etc/nginx/certs
      - letsencrypt:/etc/letsencrypt
    depends_on:
      - app

volumes:
  # Самоподписанный сертификат + симлинки live/: живут между запусками.
  certs:
  # Сертификаты Let's Encrypt и аккаунт certbot. Не удалять — иначе
  # повторный запрос упрётся в rate limit.
  letsencrypt:
