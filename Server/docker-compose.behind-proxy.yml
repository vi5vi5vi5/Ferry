# Ferry за ЧУЖИМ nginx.
#
# Накладывается поверх docker-compose.yml, когда 80 и 443 на сервере уже
# держит другой сервис (у нас это MeetUp). Тогда Ferry не поднимает свой
# TLS-терминатор, а подключается к сети соседа — и тот проксирует к нему
# запросы по имени домена.
#
# Включается через ./tools/update.sh --behind-proxy <сеть>; руками ничего
# писать не нужно, флаг запоминается в .env.

services:
  app:
    networks:
      # Своя сеть проекта остаётся: по ней ходит всё внутреннее.
      default: {}

      # Сеть соседа, из которой нас будет звать его nginx.
      shared:
        aliases:
          # Имя, по которому чужой прокси нас находит.
          #
          # Обязательно СВОЁ, а не автоматическое: compose и так добавляет
          # алиас по имени сервиса, но сервис у нас называется app — ровно
          # как у MeetUp. В общей сети имя app указывало бы сразу на два
          # контейнера, и запросы уезжали бы через раз не туда. Отладка
          # такого — худший вид отладки: всё «почти работает».
          - ferry-app

networks:
  shared:
    external: true
    name: ${FERRY_PROXY_NETWORK}
